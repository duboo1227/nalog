name: 경제뉴스 수집

on:
  schedule:
    - cron: "40 21 * * *"   # 매일 06:40 KST
    - cron: "10 3 * * *"    # 매일 12:10 KST (점심 업데이트)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 헤드라인 수집
        run: node scripts/fetch-news.mjs
      - name: 커밋
        run: |
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "news: $(TZ=Asia/Seoul date +%F\ %H:%M)"
          git pull --rebase
          git push
