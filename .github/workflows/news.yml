name: 경제뉴스 수집

on:
  schedule:
    - cron: "17 21,23,1,3,5,7,9,11,13,15 * * *"   # 2시간마다: KST 06·08·10·12·14·16·18·20·22·24시 17분
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 헤드라인 수집
        run: node scripts/fetch-news.mjs
        env:
          DEBUG_TOPS: "1"
      - name: 사설·칼럼 수집 (생각거리)
        run: node scripts/fetch-opinion.mjs
        continue-on-error: true
      - name: 커밋
        run: |
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news; [ -d data/opinion ] && git add data/opinion || true
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "news: $(TZ=Asia/Seoul date +%F\ %H:%M)"
          git pull --rebase
          git push
