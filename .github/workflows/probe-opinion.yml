name: probe-opinion
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/fetch-opinion.mjs && node -e 'const fs=require("fs");const f=fs.readdirSync("data/opinion").find(x=>/^\d/.test(x));const d=JSON.parse(fs.readFileSync("data/opinion/"+f));d.outlets.forEach(o=>{console.log("##",o.name);o.items.forEach(i=>console.log(" ",i.kind,i.title,"|",i.link))})' && base64 -w0 data/opinion/2*.json > /tmp/b && echo "B64START$(cat /tmp/b)B64END"
